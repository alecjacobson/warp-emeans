name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra reference
      - run: uv run --no-sync python scripts/fetch_reference.py
      - run: uv run --no-sync ruff check src scripts tests
      - run: uv run --no-sync pytest -q
