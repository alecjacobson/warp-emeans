[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warp-emeans"
version = "0.1.0"
description = "NVIDIA Warp e-means and low-dimensional scaling experiments"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "warp-lang>=1.19,<2"]

[project.optional-dependencies]
reference = ["scipy", "faiss-cpu"]
research = ["scipy", "matplotlib", "faiss-cpu", "torch"]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/warp_emeans"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
